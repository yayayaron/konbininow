<style>
  :root {
    --night1: #120f2b; --night2: #2a1446; --ink: #fff7ec; --muted: #c9bfe0;
    --amber: #ffb703; --pink: #ff4d8d; --teal: #2ee6c5; --card: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.14); --warn: #ffcf70;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font-family: "M PLUS Rounded 1c", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;

  body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh;

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(1.5px 1.5px at 20% 15%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 10%, #fff7 50%, transparent 51%), radial-gradient(1.5px 1.5px at 85% 30%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 35% 35%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 55% 22%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 10% 40%, #fff5 50%, transparent 51%); animation: twinkle 4s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .5 } to { opacity: 1 } }
  main { position: relative; z-index: 1; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 800; font-size: 22px; letter-spacing: .5px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 14px #ffb70355; }
  .brand b { color: var(--amber); text-shadow: 0 0 12px #ffb70388; }

  .bubble small { display: block; font-weight: 500; font-size: 12.5px; color: #6b5a8a; }
  .bubble:after { content: ""; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
    border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .bubble.pop { transform: scale(1.06); }
  .stage { position: relative; width: 210px; height: 200px; margin-top: 8px; }
  .glow { position: absolute; left: 50%; bottom: 0; width: 190px; height: 34px; transform: translateX(-50%);
    background: radial-gradient(closest-side, #ffb70355, transparent); filter: blur(2px); }
  #musubi { width: 210px; height: 200px; display: block; }
  #mb-sway { transform-origin: 100px 176px; animation: sway 3.2s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  #mb-eyes { transform-origin: 100px 86px; animation: blink 5s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
  #mb-cheeks { animation: blush 2.4s ease-in-out infinite alternate; }
  @keyframes blush { from { opacity: .55 } to { opacity: .95 } }
  #mb-arm { transform-origin: 160px 128px; animation: wave 1.6s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-22deg) } }
  #mb-tails { transform-origin: 148px 50px; animation: flap 1.2s ease-in-out infinite; }
  @keyframes flap { 0%,100% { transform: rotate(0) } 50% { transform: rotate(10deg) } }
  .hic { position: absolute; right: 2px; top: 24px; font-weight: 800; color: var(--amber); opacity: 0; font-size: 15px; }
  .hic.show { animation: hic 1.6s ease-out; }
  @keyframes hic { 0% { opacity: 0; transform: translateY(6px) } 20% { opacity: 1 } 100% { opacity: 0; transform: translateY(-18px) } }
  body.searching #mb-sway { animation: hop .45s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-12px) rotate(3deg) } }
  body.found #mb-sway { animation: cheer .6s ease-out 3; }
  @keyframes cheer { 0%,100% { transform: translateY(0) scale(1) } 40% { transform: translateY(-22px) scale(1.05) } }

  #findBtn { position: relative; width: 100%; border: 0; border-radius: 22px; padding: 18px 16px 16px; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: 24px; color: #2a1020; letter-spacing: .5px;

  #findBtn small { display: block; font-size: 14px; font-weight: 500; opacity: .85; margin-top: 2px; }
  #findBtn:active { transform: scale(.98); }

  .actions a, .share button { display: block; text-align: center; text-decoration: none; padding: 13px 8px; border-radius: 14px;
    font-weight: 800; font-size: 16px; color: var(--ink); border: 1px solid var(--line); background: #ffffff10; font-family: inherit; }
  .actions a.primary { background: linear-gradient(135deg, var(--teal), #24b3ff); color: #06222a; border: 0; }
  .actions small, .share small { display: block; font-weight: 500; font-size: 11.5px; opacity: .85; }
  .picks { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: #ffb70314; border: 1px dashed #ffb70355; font-size: 14px; }
  .picks b { color: var(--amber); }
  .share { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .share button { cursor: pointer; font-size: 15px; }
  .share .line { background: #06c755; color: #fff; border: 0; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  #otherList { list-style: none; padding: 0; margin: 8px 0 0; }
  #otherList li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; cursor: pointer; }
  #otherList li small { display: block; color: var(--muted); }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation: none !important; transition: none !important; } }
</style>

<script src="config.js?v=4"></script>
<script>
(() => {
  const CFG = window.KONBINI_CONFIG || {};
  const LANG = CFG.LANGUAGE || "en";
  const RADII = [400, 1000, 2500, 5000, 15000, 30000]; // metres, widened until an open store is found
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), btn = $("findBtn");
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  function setStatus(msg, warn = false) { statusEl.textContent = msg; statusEl.classList.toggle("warn", warn); }

  // ---- Musubi's speech bubble ----
  const LINES = {
    idle: [["もう一軒、行っとく？", "One more stop?"], ["シメのおにぎり、どう？", "An onigiri to end the night?"],
           ["ビール？アイス？ぜんぶある！", "Beer? Ice cream? It's all there!"], ["お水も買おうね", "Grab some water too!"],
           ["終電まで、まだ間に合う？", "Still time before the last train?"]],
    search: [["においで探し中…", "Sniffing out a konbini…"], ["GPSよし、ほろ酔いよし！", "GPS ok, tipsy ok!"], ["灯りはどこだ〜", "Where are those bright lights…"]],
    lost: [["うーん、見つからない…", "Hmm, can't find one…"]],
  };
  function say(ja, en) {
    const b = $("bubble"); b.innerHTML = ""; b.append(ja); const s = document.createElement("small"); s.textContent = en; b.append(s);
    b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 250);
  }
  let holdUntil = 0; // keep important messages (like "found it") on screen for a while
  setInterval(() => { if (!document.body.classList.contains("searching") && Date.now() > holdUntil) say(...pick(LINES.idle)); }, 6000);
  setInterval(() => { const h = $("hic"); h.classList.remove("show"); void h.offsetWidth; h.classList.add("show"); }, 9000);
  $("musubi").addEventListener("click", () => { say(...pick(LINES.idle)); const h = $("hic"); h.classList.remove("show"); void h.offsetWidth; h.classList.add("show"); });

  // ---- "konbini run #N tonight" counter (this device only; resets after 8 hours) ----
  function runs(add) {
    let n = 0;
    try {
      const d = JSON.parse(localStorage.getItem("kn_runs") || "{}");
      n = (d.t && Date.now() - d.t < 8 * 3600e3) ? d.n || 0 : 0;
      if (add) { n += 1; localStorage.setItem("kn_runs", JSON.stringify({ n, t: Date.now() })); }
    } catch {}
    $("runs").textContent = `🍙 今夜 ${n} 軒目`;
    return n;
  }
  runs(false);

  // ---- API key (from config.js, restricted to konbininow.com) ----
  const KEY = CFG.GOOGLE_MAPS_API_KEY || "";
  const SORRY = "Service is temporarily unavailable. Please reload the page. / 一時的に利用できません。再読み込みしてください。";
  if (!KEY) { btn.disabled = true; setStatus(SORRY, true); return; }

  // ---- Google Maps JS bootstrap loader (official dynamic import snippet) ----
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})
  ({ key: KEY, v: "weekly", language: LANG, region: "JP" });

  window.gm_authFailure = () => setStatus(SORRY, true);

  let map, MapCls, Route, AdvancedMarkerElement, LatLngBounds, PlaceCls;
  let youMarker, storeMarker, routeLines = [], otherMarkers = [];
  let fix = null; // the fresh GPS reading from the latest tap (accuracy, timestamp)
  let lastBounds = null; // area of the current route, re-applied after the result card appears
  let lastShare = null;

  async function init() {
    const [maps, routes, marker, core, places] = await Promise.all([
      google.maps.importLibrary("maps"),
      google.maps.importLibrary("routes"),
      google.maps.importLibrary("marker"),
      google.maps.importLibrary("core"),
      google.maps.importLibrary("places"),
    ]);
    MapCls = maps.Map; Route = routes.Route; PlaceCls = places.Place; AdvancedMarkerElement = marker.AdvancedMarkerElement;
    LatLngBounds = core.LatLngBounds;
  }
  const ready = init().catch((e) => { console.error(e); setStatus(SORRY, true); });

  // The map stays hidden until there is something to show, so the first screen is just Musubi and the button
  function ensureMap(center) {
    $("mapWrap").classList.add("open");
    if (!map) {
      map = new MapCls($("map"), {
        center, zoom: 16, mapId: CFG.MAP_ID || "DEMO_MAP_ID", disableDefaultUI: true, zoomControl: true,
        gestureHandling: "greedy", clickableIcons: false, maxZoom: 19, colorScheme: "DARK",
      });
    } else { map.setCenter(center); map.setZoom(16); }
  }

  // ---- helpers ----
  // Fresh GPS position. The first reading on a phone is often rough (Wi-Fi / cell based),
  // so we keep listening for up to 10 s and use the most accurate reading,
  // stopping early once it is accurate to 25 m or better.
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error("This browser can't share location."));
      let best = null, done = false, id = null;
      const finish = () => {
        if (done) return; done = true;
        if (id !== null && navigator.geolocation.clearWatch) navigator.geolocation.clearWatch(id);
        clearTimeout(timer);
        if (best) resolve(best);
        else reject(new Error("Couldn't get your location. Try again outdoors or with Wi-Fi on. / 現在地を取得できませんでした。"));
      };
      const onPos = (p) => {
        const r = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy, at: p.timestamp };
        if (!best || r.accuracy < best.accuracy) best = r;
        if (best.accuracy > 25) setStatus(`現在地の精度を上げています… Improving location accuracy (±${Math.round(best.accuracy)} m)`);
        if (best.accuracy <= 25) finish();
      };
      const onErr = (err) => {
        if (err.code === 1) {
          done = true; clearTimeout(timer);
          if (id !== null && navigator.geolocation.clearWatch) navigator.geolocation.clearWatch(id);
          reject(new Error("位置情報を許可してください。Location permission was denied. Allow location for this site in your browser settings and try again."));
        }
      };
      const timer = setTimeout(finish, 10000);
      // maximumAge 0 = never reuse an old or cached position
      const opts = { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 };
      if (navigator.geolocation.watchPosition) id = navigator.geolocation.watchPosition(onPos, onErr, opts);
      else navigator.geolocation.getCurrentPosition((p) => { onPos(p); finish(); }, onErr, opts);
    });
  }
  function metres(a, b) {
    const R = 6371000, toR = (x) => x * Math.PI / 180;
    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  const fmtDist = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
  const ll = (p) => ({ lat: p.location.lat(), lng: p.location.lng() });
  const name = (p) => p.displayName || "Convenience store";

  // Japanese name for a store (Place Details in ja), cached per store
  const jaCache = new Map();
  async function jaName(p) {
    if (jaCache.has(p.id)) return jaCache.get(p.id);
    let n = "";
    try {
      const res = await fetch(`https://places.googleapis.com/v1/places/${encodeURIComponent(p.id)}?languageCode=ja&regionCode=JP`, {
        headers: { "X-Goog-Api-Key": KEY, "X-Goog-FieldMask": "displayName" },
      });
      const d = await res.json();
      n = (d.displayName && d.displayName.text) || "";
    } catch {}
    jaCache.set(p.id, n);
    return n;
  }
  const jaLine = (en, ja) => (ja && ja !== en ? ja : "");

  // Google Maps links that point at the store itself (name + Place ID), not raw coordinates.
  // No origin is given, so Google Maps starts from the phone's live location.
  const dirUrl = (p) => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(name(p))}` +
    `&destination_place_id=${encodeURIComponent(p.id)}&travelmode=walking`;
  const placeUrl = (p) => p.googleMapsURI ||
    `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name(p))}&query_place_id=${encodeURIComponent(p.id)}`;

  // true = open now, false = closed, undefined = hours not listed (handles 24-hour stores correctly)
  async function openState(place) {
    if (place.businessStatus && place.businessStatus !== "OPERATIONAL") return false;
    return place.openNow;
  }

  // Places API (New) Nearby Search over REST, so we get Google's own "open now" flag
  async function searchAround(center, radius) {
    const res = await fetch("https://places.googleapis.com/v1/places:searchNearby", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Goog-Api-Key": KEY,
        "X-Goog-FieldMask": "places.id,places.displayName,places.location,places.formattedAddress," +
          "places.businessStatus,places.googleMapsUri,places.currentOpeningHours.openNow,places.regularOpeningHours.openNow",
      },
      body: JSON.stringify({
        includedTypes: ["convenience_store"],
        excludedPrimaryTypes: ["gas_station"],
        maxResultCount: 20,
        rankPreference: "DISTANCE",
        languageCode: LANG, regionCode: "JP",
        locationRestriction: { circle: { center: { latitude: center.lat, longitude: center.lng }, radius } },
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) || "Store search failed.");
    return (data.places || []).map((p) => ({
      id: p.id,
      displayName: p.displayName && p.displayName.text,
      location: { lat: () => p.location.latitude, lng: () => p.location.longitude },
      formattedAddress: p.formattedAddress,
      businessStatus: p.businessStatus,
      googleMapsURI: p.googleMapsUri,
      openNow: p.currentOpeningHours ? p.currentOpeningHours.openNow
             : p.regularOpeningHours ? p.regularOpeningHours.openNow : undefined,
    }));
  }

  function clearMap() {
    routeLines.forEach((l) => l.setMap(null)); routeLines = [];
    otherMarkers.forEach((m) => (m.map = null)); otherMarkers = [];
    if (storeMarker) storeMarker.map = null;
  }

  function pin(label, bg, fg = "#fff") {
    const el = document.createElement("div");
    el.textContent = label;
    el.style.cssText = `background:${bg};color:${fg};font:800 13px "M PLUS Rounded 1c",system-ui;padding:6px 10px;border-radius:14px;` +
      "box-shadow:0 2px 10px rgba(0,0,0,.45);border:2px solid #fff;white-space:nowrap;" +
      "max-width:170px;overflow:hidden;text-overflow:ellipsis";
    return el;
  }

  async function drawRoute(from, place) {
    const to = ll(place);
    try {
      // Destination as a Google place (by Place ID), so the route ends at the store's real entrance
      const dest = PlaceCls && place.id ? new PlaceCls({ id: place.id }) : to;
      const { routes } = await Route.computeRoutes({
        origin: from, destination: dest, travelMode: "WALKING",
        fields: ["path", "distanceMeters", "durationMillis"],
      });
      if (routes && routes[0]) {
        routeLines = routes[0].createPolylines({ polylineOptions: { strokeColor: "#2ee6c5", strokeWeight: 6, strokeOpacity: .95 } });
        routeLines.forEach((l) => l.setMap(map));
        const b = new LatLngBounds(); routes[0].path.forEach((pt) => b.extend(pt));
        b.extend(from); b.extend(to); lastBounds = b;
        map.fitBounds(b, 60);
        const mins = routes[0].durationMillis ? Math.max(1, Math.round(routes[0].durationMillis / 60000)) : null;
        return { dist: routes[0].distanceMeters, mins };
      }
    } catch (e) { console.warn("Route failed, showing straight-line distance", e); }
    const b = new LatLngBounds(); b.extend(from); b.extend(to); lastBounds = b; map.fitBounds(b, 80);
    return { dist: null, mins: null };
  }

  // Walking time to a store (used to pick the shortest walk among the closest open stores)
  async function walkMillis(from, place) {
    try {
      const dest = PlaceCls && place.id ? new PlaceCls({ id: place.id }) : ll(place);
      const { routes } = await Route.computeRoutes({
        origin: from, destination: dest, travelMode: "WALKING", fields: ["durationMillis"],
      });
      return routes && routes[0] && routes[0].durationMillis ? routes[0].durationMillis : Infinity;
    } catch { return Infinity; }
  }

  // Musubi's picks: two fun suggestions plus water, every time
  const PICKS = ["🍙 おにぎり Onigiri", "🍢 おでん Oden", "🍗 からあげ Karaage", "🍜 カップ麺 Cup noodles",
                 "🍦 アイス Ice cream", "🍺 もう1本 One more can", "🥪 たまごサンド Egg sando", "🍮 プリン Pudding"];
  function picksHtml() {
    const a = [...PICKS].sort(() => Math.random() - .5).slice(0, 2);
    return `<b>むすびのおすすめ · Musubi's picks:</b> ${a.join(" ・ ")} ・ 💧 お水 Water (trust me)`;
  }

  async function show(from, chosen, openFlag, others) {
    clearMap();
    const to = ll(chosen);
    storeMarker = new AdvancedMarkerElement({ map, position: to, title: name(chosen), content: pin("🏪 " + name(chosen), "#ffb703", "#2a1020") });
    others.forEach((o) => {
      const m = new AdvancedMarkerElement({ map, position: ll(o), title: name(o), content: pin("🏪", "#5b4a7a") });
      m.addListener("click", () => show(from, o, true, others.filter((x) => x !== o).concat(chosen)));
      otherMarkers.push(m);
    });

    setStatus("ルート計算中… Getting walking route…");
    const r = await drawRoute(from, chosen);
    const straight = metres(from, to);
    $("rName").textContent = name(chosen);
    $("rNameJa").textContent = "";
    jaName(chosen).then((ja) => { if ($("rName").textContent === name(chosen)) $("rNameJa").textContent = jaLine(name(chosen), ja); });
    const ageS = fix ? Math.max(0, Math.round((Date.now() - (fix.at || Date.now())) / 1000)) : 0;
    $("rLoc").textContent = fix && fix.accuracy
      ? `現在地 ±${Math.round(fix.accuracy)}m · Your location: accurate to ~${Math.round(fix.accuracy)} m, ${ageS < 5 ? "just now" : ageS + " s ago"}`
      : "";
    $("rBadge").textContent = openFlag ? "Open now · 営業中" : "Hours not listed · 営業時間不明";
    $("rBadge").classList.toggle("unknown", !openFlag);
    $("rMins").textContent = r.mins ? `徒歩${r.mins}分` : "";
    $("rDist").textContent = r.dist ? `${fmtDist(r.dist)} walk · about ${r.mins} min` : `${fmtDist(straight)} away (straight line)`;
    $("rAddr").textContent = chosen.formattedAddress || "";
    $("navLink").href = dirUrl(chosen);
    $("infoLink").href = placeUrl(chosen);
    $("picks").innerHTML = picksHtml();
    lastShare = { mins: r.mins };

    const list = $("otherList"); list.innerHTML = "";
    others.slice(0, 5).forEach((o) => {
      const li = document.createElement("li");
      li.innerHTML = `<span><span></span><small></small></span><span class="meta"></span>`;
      li.children[0].children[0].textContent = name(o);
      li._loadJa = () => jaName(o).then((ja) => { li.children[0].children[1].textContent = jaLine(name(o), ja); });
      if ($("others").open) li._loadJa(); // Japanese names for alternatives load only when the list is opened
      li.children[1].textContent = `直線 ${fmtDist(metres(from, ll(o)))}`;
      li.onclick = () => show(from, o, true, others.filter((x) => x !== o).concat(chosen));
      list.appendChild(li);
    });
    $("others").classList.toggle("hidden", others.length === 0);
    $("result").classList.remove("hidden");
    if (lastBounds) setTimeout(() => map.fitBounds(lastBounds, 50), 550); // after the map has opened
    document.body.classList.remove("searching"); document.body.classList.add("found");
    setTimeout(() => document.body.classList.remove("found"), 2000);
    if (navigator.vibrate) try { navigator.vibrate([60, 40, 60]); } catch {}
    say(r.mins ? `${r.mins}分でつくよ！カンパイ🍻` : "見つけた！カンパイ🍻", r.mins ? `Found it! ${r.mins} min walk. Kanpai!` : "Found it! Kanpai!");
    holdUntil = Date.now() + 30000;
    setTimeout(() => $("mapWrap").scrollIntoView({ behavior: "smooth", block: "start" }), 300);
    const rough = fix && fix.accuracy > 100;
    setStatus(rough
      ? `現在地の精度が低いため、屋外で再度お試しください。 Your location is approximate (±${Math.round(fix.accuracy)} m), so the route may start in the wrong place. Go outdoors and tap again.`
      : openFlag ? "" : "No store with confirmed hours is open nearby; this is the nearest one without listed hours.", rough || !openFlag);
  }

  $("others").addEventListener("toggle", () => {
    if ($("others").open) [...$("otherList").children].forEach((li) => li._loadJa && li._loadJa());
  });

  // ---- sharing (Web Share sheet, or LINE) ----
  const shareText = () => {
    const m = lastShare && lastShare.mins;
    return m ? `むすびが${m}分のコンビニ見つけてくれた🍙 Musubi found me a konbini ${m} min away!`
             : "むすびが一番近いコンビニを見つけてくれる🍙 Musubi finds the nearest open konbini!";
  };
  $("shareBtn").onclick = async () => {
    const url = "https://konbininow.com/";
    try {
      if (navigator.share) await navigator.share({ title: "コンビニNOW", text: shareText(), url });
      else { await navigator.clipboard.writeText(`${shareText()} ${url}`); setStatus("リンクをコピーしました · Link copied!"); }
    } catch {}
  };
  $("lineBtn").onclick = () => {
    const url = "https://konbininow.com/";
    window.open(`https://line.me/R/share?text=${encodeURIComponent(shareText() + " " + url)}`, "_blank", "noopener");
  };

  btn.onclick = async () => {
    btn.disabled = true; $("result").classList.add("hidden");
    document.body.classList.add("searching");
    say(...pick(LINES.search));
    try {
      await ready;
      if (!MapCls) throw new Error("Google Maps didn't load.");
      setStatus("現在地を取得中… Getting your current location…");
      fix = await getPosition();
      const here = { lat: fix.lat, lng: fix.lng }; // plain lat/lng for Google Maps
      ensureMap(here);
      if (youMarker) youMarker.map = null;
      youMarker = new AdvancedMarkerElement({ map, position: here, title: "You", content: pin("🍙 You", "#ff4d8d") });

      let fallback = null;
      for (const radius of RADII) {
        setStatus(`${fmtDist(radius)}以内を検索中… Searching within ${fmtDist(radius)}…`);
        say(...pick(LINES.search));
        const found = await searchAround(here, radius);
        const states = await Promise.all(found.map(openState));
        const open = found.filter((_, i) => states[i] === true)
          .sort((a, b) => metres(here, ll(a)) - metres(here, ll(b)));
        if (open.length) {
          // Compare real walking times for the 3 closest open stores and pick the shortest walk
          const top = open.slice(0, 3);
          setStatus("徒歩ルートを比較中… Comparing walking routes…");
          const times = await Promise.all(top.map((p) => walkMillis(here, p)));
          const best = times.indexOf(Math.min(...times));
          const chosen = top[best];
          runs(true);
          await show(here, chosen, true, open.filter((p) => p !== chosen));
          return;
        }
        if (!fallback) fallback = found.find((_, i) => states[i] === undefined) || null;
      }
      if (fallback) { runs(true); await show(here, fallback, false, []); return; }
      say(...LINES.lost[0]); holdUntil = Date.now() + 30000;
      setStatus("30km以内に営業中のコンビニはありません。 No open convenience store found within 30 km.", true);
    } catch (e) {
      console.error(e);
      say("あれれ…", "Oops…"); holdUntil = Date.now() + 30000;
      setStatus(e.message || "Something went wrong. Please try again.", true);
    } finally {
      btn.disabled = false;
      document.body.classList.remove("searching");
    }
  };
})();
</script>
</body>
</html>
